<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kasir - Joose Juice</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <h2>Dashboard Kasir</h2>
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="menu-section">
    <h3>Daftar Pesanan Masuk</h3>

    <div class="menu-grid" id="pesananGrid">
      <p>TEST HALAMAN KASIR</p>
    </div>
  </div>

  <div class="cart-section">

    <h3>Ringkasan Transaksi</h3>

    <div class="cart-list" id="summaryList">
    </div>

    <div class="cart-summary">

      <div class="total">
        Total: Rp <span id="totalHarga">0</span>
      </div>

      <button class="btn primary" onclick="cetakStruk()">
        Cetak Struk
      </button>

      <button class="btn" onclick="resetPesanan()">
        Hapus Semua Pesanan
      </button>

    </div>

    <hr>

    <h4>Riwayat Transaksi</h4>

    <div class="history-list" id="historyList">
      <p>Belum ada transaksi</p>
    </div>

  </div>

<div id="receipt" class="receipt hidden">
  <h3>Struk Pembelian</h3>
  <div id="receiptContent"></div>

  <button class="btn primary" onclick="printStruk()">
    Print
  </button>

  <button class="btn" onclick="closeStruk()">
    Tutup
  </button>
</div>

<script src="kasir.js"></script>

</body>
</html>
