<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Daftar Menu Joose Juice</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Daftar Menu Joose Juice</h1>
    <div class="user">
      <span id="clock"></span>
    </div>
  </header>

  <main class="container">
    <section class="menu-section">
      <h2>Daftar Minuman Joose Juice </h2>
      <div id="menu" class="menu-grid"></div>
    </section>

    <aside class="cart-section">
      <h2>Keranjang</h2>
      <div id="cart-list" class="cart-list"></div>

      <div class="cart-summary">
        <div>Subtotal: <span id="subtotal">Rp0</span></div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>PPN (0%):</div>
          <div><span id="tax">Rp0</span></div>
        </div>
        <div class="total">Total: <span id="total">Rp0</span></div>

        <hr>

        <h3>Informasi Pesanan</h3>

        <div style="margin-bottom:10px;">
          <label for="customer-name">
            <strong>Nama Customer</strong>
          </label>

          <input
            type="text"
            id="customer-name"
            placeholder="Masukkan nama customer"
            style="
              width:100%;
              padding:10px;
              margin-top:5px;
              box-sizing:border-box;
            "
          >
        </div>

        <div style="margin-bottom:10px;">
          <label for="estimate-time">
            <strong>Estimasi Selesai</strong>
          </label>

          <select
            id="estimate-time"
            style="
              width:100%;
              padding:10px;
              margin-top:5px;
              box-sizing:border-box;
            "
          >
            <option value="10">10 menit</option>
            <option value="15" selected>15 menit</option>
            <option value="20">20 menit</option>
            <option value="30">30 menit</option>
          </select>
        </div>

        <div
          id="estimated-result"
          style="
            margin-bottom:10px;
            font-weight:bold;
            color:#2878ff;
          "
        >
          Estimasi selesai akan muncul setelah pesanan dibuat.
        </div>

        <button id="place-order" class="btn primary">
          Place Order
        </button>
        <button id="clear-cart" class="btn">Kosongkan</button>
      </div>

      <hr />

      <h3>Riwayat Pesanan</h3>
      <div id="history" class="history-list"></div>
      <button id="clear-history" class="btn small">Hapus Riwayat</button>
    </aside>
  </main>

  <footer class="footer">
    <small>Daftar Menu Joose Juice - 2026 </small>
  </footer>

  <!-- Receipt modal -->
  <div id="receipt-modal" class="receipt hidden" role="dialog" aria-hidden="true">
    <h3>STRUK PEMBELIAN</h3>
    <div id="receipt-body">
      <div><strong id="receipt-id"></strong></div>
      <div id="receipt-date" style="color:var(--muted); font-size:0.9rem;"></div>
      <div id="receipt-items" style="margin-top:10px;"></div>
      <hr>
      <div>Subtotal: <span id="r-subtotal"></span></div>
      <div>PPN: <span id="r-tax"></span></div>
      <div style="font-weight:800; margin-top:6px;">Total: <span id="r-total"></span></div>
      <div style="margin-top:10px; display:flex; gap:8px;">
        <button id="close-receipt" class="btn">Tutup</button>
        <button id="print-receipt" class="btn primary">Cetak (Print)</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
