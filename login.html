<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Joose Juice</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

  <!-- Dekorasi buah -->
  <div class="fruit fruit-orange">🍊</div>
  <div class="fruit fruit-lemon">🍋</div>
  <div class="fruit fruit-strawberry">🍓</div>
  <div class="fruit fruit-watermelon">🍉</div>
  <div class="fruit fruit-grape">🍇</div>

  <main class="login-container">

    <!-- BAGIAN KIRI -->
    <section class="login-brand">

      <div class="juice-cup">
        <div class="cup-lid"></div>

        <div class="straw"></div>

        <div class="juice">
          🍊
        </div>
      </div>

      <h1>Joose Juice</h1>

      <p>
        Fresh • Healthy • Delicious
      </p>

      <div class="fruit-row">
        🍊 🍓 🍉 🍋 🍇
      </div>

    </section>


    <!-- BAGIAN KANAN -->
    <section class="login-card">

      <div class="login-header">

        <div class="login-icon">
          🥤
        </div>

        <h2>Selamat Datang!</h2>

        <p>
          Silakan login untuk melanjutkan
        </p>

      </div>


      <form id="loginForm">

        <div class="input-group">

          <label for="username">
            Username
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              👤
            </span>

            <input
              type="text"
              id="username"
              name="username"
              placeholder="Masukkan username"
              required
            >

          </div>

        </div>


        <div class="input-group">

          <label for="password">
            Password
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              🔒
            </span>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Masukkan password"
              required
            >

          </div>

        </div>


        <button
          type="submit"
          class="login-button">

          🍹 Login

        </button>

      </form>


      <div class="login-footer">

        <span>🍊</span>

        <p>
          Joose Juice • Fresh Every Day
        </p>

        <span>🍓</span>

      </div>

    </section>

  </main>


  <script>
  const usernameBenar = "joosejuice";
  const passwordBenar = "123456";

  document.getElementById("loginForm").addEventListener("submit", function(event) {

      event.preventDefault();

      const username =
          document.getElementById("username").value;

      const password =
          document.getElementById("password").value;

      if (
          username === usernameBenar &&
          password === passwordBenar
      ) {

          window.location.href = "kantin.html";

      } else {

          alert("Username atau password salah!");

      }

  });
  </script>
</body>
</html>
